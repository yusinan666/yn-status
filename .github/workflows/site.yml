# GTA:Yonder Custom Status Page Build
name: Static Site CI
on:
  push:
    paths:
      - "site/**"
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
concurrency:
  group: site-build
  cancel-in-progress: false
jobs:
  build:
    name: Build and deploy site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build site
        run: node build.mjs
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          user_name: "GTA:Yonder Bot"
          user_email: "status@gtayonder.com"
